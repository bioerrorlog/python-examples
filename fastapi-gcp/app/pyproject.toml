[project]
name = "app"
version = "0.1.0"
description = "FastAPI server running on GCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "google-auth>=2.38.0",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "requests>=2.32.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
